services:
  frontend:
    image: nginx:latest
    container_name: frontend_educativo
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

  backend:
    image: node:18
    container_name: backend_educativo
    working_dir: /app
    volumes:
      - ./backend:/app
    command: ["node", "app.js"]
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: plataforma_educativa
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: db_educativa
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: plataforma_educativa
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: