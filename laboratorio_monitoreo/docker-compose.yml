services:
  pedidos:
    build: ./pedidos
    ports:
      - "5003:5000"

  inventario:
    build: ./inventario
    ports:
      - "5004:5000"

  pagos:
    build: ./pagos
    ports:
      - "5005:5000"

  gateway:
    build: ./gateway
    ports:
      - "5000:5000"
